<!doctype html>
<html lang="zh-CN" data-theme="dark" style="background-color: var(--bg-deep, #080808)">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content, viewport-fit=cover"
    />
    <meta name="theme-color" content="#080808" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>Crush</title>
    <script>
      // 首帧按已保存主题设置 data-theme：浅色/自定义主题刷新时不会先闪一下深色；
      // 只接受小写字母数字与连字符，脏值交给 ui-store 的注册表校验回落默认主题
      try {
        var saved = localStorage.getItem("crush.theme")
        if (saved && /^[a-z0-9-]+$/.test(saved)) document.documentElement.dataset.theme = saved
      } catch (err) {}
    </script>
  </head>
  <body class="antialiased overscroll-none overflow-hidden">
    <noscript>你需要启用 JavaScript 才能运行本应用。</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
